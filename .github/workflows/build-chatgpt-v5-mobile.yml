        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/v5-source"
          printf '%s' "$V5_SOURCE_ARCHIVE" | tr -d '[:space:]' | base64 --decode > "$RUNNER_TEMP/v5-source.tar.gz"
          tar -xzf "$RUNNER_TEMP/v5-source.tar.gz" -C "$RUNNER_TEMP/v5-source"
          echo "PROJECT_DIR=$RUNNER_TEMP/v5-source/ChatGPTWebV15-V5" >> "$GITHUB_ENV"

      - name: Generate app icon sizes
        run: |
          set -euo pipefail
          ICON_DIR="$PROJECT_DIR/ChatGPTWebView/Assets.xcassets/AppIcon.appiconset"
          ICON_SOURCE="$ICON_DIR/source-user-icon.png"
          test -f "$ICON_SOURCE"
          for size in 20 29 40 50 57 58 60 72 76 80 87 100 114 120 144 152 167 180 1024; do
            /usr/bin/sips -z "$size" "$size" "$ICON_SOURCE" --out "$ICON_DIR/$size.png" >/dev/null
          done

      - name: Inspect project
        run: |
          set -euo pipefail
          /usr/bin/plutil -lint "$PROJECT_DIR/ChatGPTWebView/Info.plist"
          xcodebuild -project "$PROJECT_DIR/ChatGPTWebV15.xcodeproj" -list

      - name: Build unsigned app
        run: |
          set -euo pipefail
          xcodebuild \
            -project "$PROJECT_DIR/ChatGPTWebV15.xcodeproj" \
            -scheme ChatGPTWebV15 \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath "$RUNNER_TEMP/DerivedData" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY='' \
            DEVELOPMENT_TEAM='' \
            clean build

      - name: Package unsigned IPA
        run: |
          set -euo pipefail
          APP_PATH=$(find "$RUNNER_TEMP/DerivedData/Build/Products/Release-iphoneos" -maxdepth 1 -type d -name '*.app' | head -n 1)
          test -n "$APP_PATH"
          test -f "$APP_PATH/ChatGPTWebV15"
          mkdir -p "$RUNNER_TEMP/package/Payload"
          ditto "$APP_PATH" "$RUNNER_TEMP/package/Payload/$(basename "$APP_PATH")"
          cd "$RUNNER_TEMP/package"
          /usr/bin/zip -qry "$GITHUB_WORKSPACE/ChatGPTWebV15-V5-unsigned.ipa" Payload
          /usr/bin/unzip -t "$GITHUB_WORKSPACE/ChatGPTWebV15-V5-unsigned.ipa"
          /usr/bin/shasum -a 256 "$GITHUB_WORKSPACE/ChatGPTWebV15-V5-unsigned.ipa"
          /usr/bin/file "$APP_PATH/ChatGPTWebV15"
          /usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$APP_PATH/Info.plist"
          /usr/libexec/PlistBuddy -c 'Print :MinimumOSVersion' "$APP_PATH/Info.plist"

      - name: Upload V5 IPA
        uses: actions/upload-artifact@v4
        with:
          name: ChatGPTWebV15-V5-unsigned
          path: ChatGPTWebV15-V5-unsigned.ipa
          if-no-files-found: error
          retention-days: 14
