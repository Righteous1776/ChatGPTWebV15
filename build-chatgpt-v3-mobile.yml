          printf '%s' "$V3_SOURCE_ARCHIVE" | tr -d '[:space:]' | base64 --decode > "$RUNNER_TEMP/v3-source.tar.gz"
          tar -xzf "$RUNNER_TEMP/v3-source.tar.gz"

      - name: Generate icon resources
        run: |
          SOURCE_ICON="AppIcon-1024.png"
          PROJECT_DIR="ChatGPTWebV15-V3"
          ICON_DIR="$PROJECT_DIR/ChatGPTWebView/Assets.xcassets/AppIcon.appiconset"
          python3 - <<'PY'
          from pathlib import Path

          width = height = 1024
          dark = bytes((32, 33, 35))
          green = bytes((16, 163, 127))
          white = bytes((245, 245, 245))
          image = bytearray(f"P6\n{width} {height}\n255\n".encode())
          for y in range(height):
              row = bytearray()
              for x in range(width):
                  radius = (x - 512) ** 2 + (y - 512) ** 2
                  if radius < 350 ** 2:
                      color = green
                  elif abs(x - y) < 18 or abs((width - x) - y) < 18:
                      color = white
                  else:
                      color = dark
                  row.extend(color)
              image.extend(row)
          Path("AppIcon-1024.ppm").write_bytes(image)
          PY
          sips -s format png AppIcon-1024.ppm --out "$SOURCE_ICON" >/dev/null
          rm AppIcon-1024.ppm
          test -f "$SOURCE_ICON"
          mkdir -p "$ICON_DIR"
          cp "$SOURCE_ICON" "$PROJECT_DIR/ChatGPTWebView/appstore.png"
          for size in 20 29 40 50 57 58 60 72 76 80 87 100 114 120 144 152 167 180 1024; do
            sips -z "$size" "$size" "$SOURCE_ICON" --out "$ICON_DIR/$size.png" >/dev/null
          done

      - name: Build unsigned app
        working-directory: ChatGPTWebV15-V3
        run: |
          xcodebuild \
            -project ChatGPTWebV15.xcodeproj \
            -scheme ChatGPTWebV15 \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY='' \
            clean build

      - name: Package unsigned IPA
        working-directory: ChatGPTWebV15-V3
        run: |
          mkdir -p package/Payload
          cp -R build/Build/Products/Release-iphoneos/ChatGPTWebV15.app package/Payload/
          cd package
          zip -qry ../ChatGPTWebV15-V3-unsigned.ipa Payload

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: ChatGPTWebV15-V3-unsigned
          path: ChatGPTWebV15-V3/ChatGPTWebV15-V3-unsigned.ipa
          if-no-files-found: error
          retention-days: 14
